<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flipbook Carrefour</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #f0f0f0;
    }

    .flipbook-container {
      width: 80%; /* Ajusta el ancho según sea necesario */
      max-width: 800px; /* Ancho máximo para pantallas grandes */
      overflow: hidden;
      position: relative;
    }

    .flipbook {
      display: flex;
      transition: none;
      will-change: transform;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .page {
      flex-shrink: 0;
      width: 100%;
      height: 100vh;
      max-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
      touch-action: none;
    }

    .page img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
    }
    
    .touch-area {
      position: absolute;
      top: 0;
      height: 100%;
      z-index: 20;
      cursor: pointer;
      background: transparent;
    }

    /* Dividir en 3 tercios: prev | mid | next */
    .touch-prev { left: 0; width: 33.3333%; }
    .touch-mid { left: 33.3333%; width: 33.3333%; }
    .touch-next { right: 0; width: 33.3333%; }

    .nav-button {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background-color: rgba(0, 0, 0, 0.5);
      color: white;
      padding: 10px 20px;
      border: none;
      cursor: pointer;
      z-index: 10;
    }

    .nav-button:hover {
      background-color: rgba(0, 0, 0, 0.8);
    }

    .nav-prev {
      left: 10px;
    }

    .nav-next {
      right: 10px;
    }

    /* Estilos para móvil */
    @media (max-width: 600px) {
      .flipbook-container {
        width: 100%;
      }
      .page {
        width: 100vw;
      }
      .nav-button {
        display: none; /* Opcional: Ocultar los botones en móvil y usar solo el touch */
      }
    }
  </style>
</head>
<body>

  <div class="flipbook-container">
    <div class="touch-area touch-prev" aria-label="Anterior"></div>
    <div class="touch-area touch-mid" aria-label="Enlace central"></div>
    <div class="touch-area touch-next" aria-label="Siguiente"></div>
    <div class="flipbook">
      <div class="page" data-page="1"><img src="1.webp" alt="Página 1" loading="eager"></div>
      <div class="page" data-page="2"><img src="2.webp" alt="Página 2" loading="lazy"></div>
      <div class="page" data-page="3"><img src="3.webp" alt="Página 3" loading="lazy"></div>
      <div class="page" data-page="4"><img src="4.webp" alt="Página 4" loading="lazy"></div>
      <div class="page" data-page="5"><img src="5.webp" alt="Página 5" loading="lazy"></div>
      <div class="page" data-page="6"><img src="6.webp" alt="Página 6" loading="lazy"></div>
      <div class="page" data-page="7"><img src="7.webp" alt="Página 7" loading="lazy"></div>
      <div class="page" data-page="8"><img src="8.webp" alt="Página 8" loading="lazy"></div>
      <div class="page" data-page="9"><img src="9.webp" alt="Página 9" loading="lazy"></div>
      <div class="page" data-page="10"><img src="10.webp" alt="Página 10" loading="lazy"></div>
      <div class="page" data-page="11"><img src="11.webp" alt="Página 11" loading="lazy"></div>
      <div class="page" data-page="12"><img src="12.webp" alt="Página 12" loading="lazy"></div>
      <div class="page" data-page="13"><img src="13.webp" alt="Página 13" loading="lazy"></div>
      <div class="page" data-page="14"><img src="14.webp" alt="Página 14" loading="lazy"></div>
      <div class="page" data-page="15"><img src="15.webp" alt="Página 15" loading="lazy"></div>
      <div class="page" data-page="16"><img src="16.webp" alt="Página 16" loading="lazy"></div>
      <div class="page" data-page="17"><img src="17.webp" alt="Página 17" loading="lazy"></div>
      <div class="page" data-page="18"><img src="18.webp" alt="Página 18" loading="lazy"></div>
      <div class="page" data-page="19"><img src="19.webp" alt="Página 19" loading="lazy"></div>
      <div class="page" data-page="20"><img src="20.webp" alt="Página 20" loading="lazy"></div>
      <div class="page" data-page="21"><img src="21.webp" alt="Página 21" loading="lazy"></div>
      <!--PONER AQUÍ LAS PÁGINAS COPÓN!!!!!--> 
    </div>

    <button class="nav-button nav-prev">Anterior</button>
    <button class="nav-button nav-next">Siguiente</button>
  </div>

  <script>
    const flipbook = document.querySelector('.flipbook');
    const pages = document.querySelectorAll('.page');
    const prevButton = document.querySelector('.nav-prev');
    const nextButton = document.querySelector('.nav-next');
  const touchPrevArea = document.querySelector('.touch-prev');
  const touchMidArea = document.querySelector('.touch-mid');
  const touchNextArea = document.querySelector('.touch-next');
    let currentPage = 1;
    const totalPages = pages.length;
    
    // Precarga ligera: solo páginas adyacentes para mantener rápida la carga inicial
    function preloadAdjacent(index) {
      [index - 1, index + 1].forEach((i) => {
        if (i >= 1 && i <= totalPages) {
          const img = new Image();
          img.src = `${i}.webp`;
        }
      });
    }
    // Preload first adjacent pages
    preloadAdjacent(1);

    // Mapa de enlaces para el tercio medio por número de página
    const midLinks = {
      3: 'https://www.facebook.com/groups/clubcarrefourfamilia/posts/1227591265691990/',
      12: 'https://www.carrefour.es/clubcarrefour/clubs-deportivos/',
      16: 'https://www.whatsapp.com/channel/0029Vasje9C17EmpFGiuhO0p',
      18: 'https://www.carrefour.es/clubcarrefour/comunidades/'
    };

    function updateView() {
      let translateX = 0;

      if (currentPage === 1) {
        translateX = 0; // Mostrar solo la primera página
      } else if (currentPage === totalPages) {
        translateX = -(totalPages - 1) * 100; // Mostrar solo la última página
      } else {
        translateX = -(currentPage - 1) * 100; // Mostrar 2 páginas
      }

      flipbook.style.transform = `translateX(${translateX}%)`;
      // Preload adjacent images for the new page
      preloadAdjacent(currentPage);
    }

    function goToNextPage() {
        if (currentPage < totalPages) {
            if(currentPage===1){
                currentPage =2;
            }else{
              currentPage++;
            }
        } else {
            currentPage = 1; // Vuelve a la primera página
        }
        updateView();
    }

    function goToPrevPage() {
      if (currentPage > 1) {
        if(currentPage===2){
            currentPage=1
        }else{
            currentPage--
        }
        updateView();
      } else {
          currentPage = totalPages; // Vuelve a la última página
          updateView()
      }
    }

    // Pointer events for faster response on supported devices
    const addFastHandler = (el, fn) => {
      if (!el) return;
      el.addEventListener('pointerdown', (e) => { e.preventDefault(); fn(); });
      el.addEventListener('click', fn);
    };

    addFastHandler(nextButton, goToNextPage);
    addFastHandler(prevButton, goToPrevPage);
    addFastHandler(touchNextArea, goToNextPage);
    addFastHandler(touchPrevArea, goToPrevPage);

    // Middle area: if current page has a link, open it; otherwise go next
    function onTouchMid() {
      const link = midLinks[currentPage];
      if (link) {
        window.open(link, '_blank');
      } else {
        goToNextPage();
      }
    }
    addFastHandler(touchMidArea, onTouchMid);

  // Touch events for mobile and swipe handling
    let touchStartX = 0;
    let touchStartY = 0;
    let isSwiping = false;

    flipbook.addEventListener('touchstart', (e) => {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
      isSwiping = true;
    }, { passive: true });

    flipbook.addEventListener('touchmove', (e) => {
      if (!isSwiping) return;
      
      const touchMoveX = e.touches[0].clientX;
      const touchMoveY = e.touches[0].clientY;
      
      // Verificar si el movimiento es más horizontal que vertical
      const deltaX = Math.abs(touchMoveX - touchStartX);
      const deltaY = Math.abs(touchMoveY - touchStartY);
      
      if (deltaX > deltaY) {
        e.preventDefault();
      }
    }, { passive: false });

    flipbook.addEventListener('touchend', (e) => {
      if (!isSwiping) return;
      
      const touchEndX = e.changedTouches[0].clientX;
      const touchDiff = touchEndX - touchStartX;
      const minSwipeDistance = 30; // Reducido para mayor sensibilidad

      if (Math.abs(touchDiff) > minSwipeDistance) {
        if (touchDiff > 0) {
          goToPrevPage(); // Swipe right
        } else {
          goToNextPage(); // Swipe left
        }
      }
      
      isSwiping = false;
    }, { passive: true });

    // Keyboard navigation (flechas)
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') goToNextPage();
      if (e.key === 'ArrowLeft') goToPrevPage();
    });

    // Initial view
    updateView();
  </script>

</body>
</html>
