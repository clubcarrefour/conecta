<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📰 Conecta. La revista de El Club Carrefour</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #ffffff;
      color: #fff;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    .flipbook-container {
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: visible;
      position: relative;
      background: #ffffff;
      touch-action: manipulation;
      width: 600px;
      height: 900px;
      margin: 0 auto;
    }
    .flipbook-page {
      width: 100%;
      height: 100%;
      max-width: 600px;
      max-height: 900px;
      background: #fff;
      box-shadow: 0 4px 24px rgba(0,0,0,0.3);
      border-radius: 8px;
      overflow: hidden;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: box-shadow 0.2s;
    }
    .central-strip {
      position: absolute;
      top: 64%;
      left: 2%;
      width: 100%;
      height: 20%;
      background: rgba(0,0,0,0.0);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
    }
    .central-strip a {
      color: #fff;
      background: #055096;
      padding: 0.3em 0.5em;
      border-radius: 20px;
      text-decoration: none;
      font-weight: bold;
      font-size: 1.1em;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }
    img.page-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    /* Flechas de navegación laterales solo desktop */
    .nav-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      font-size: 3.5rem;
      color: #fff;
      background: rgba(0,120,215,0.92);
      border-radius: 50%;
      width: 2.7em;
      height: 2.7em;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      pointer-events: none;
      z-index: 20;
      border: 2px solid #0078d7;
      box-shadow: 0 2px 12px rgba(0,0,0,0.18);
      opacity: 1;
      font-weight: bold;
      transition: background 0.2s, box-shadow 0.2s;
    }
    .nav-arrow.left {
      left: 1.2em;
    }
    .nav-arrow.right {
      right: 1.2em;
    }
    @media (max-width: 600px) {
      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }
      .flipbook-container {
        width: 100vw;
        height: 100vh;
        max-width: 100vw;
        max-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto;
      }
      .flipbook-page {
        max-width: 100vw;
        max-height: 100vh;
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      img.page-img {
        width: 100vw;
        height: 100vh;
        max-width: 100vw;
        max-height: 100vh;
        object-fit: contain;
        display: block;
      }
      .nav-arrow {
        display: none !important;
      }
    }
  </style>
</head>
<body>
  <div class="flipbook-container" id="flipbook">
    <div class="nav-arrow left">&#60;</div>
    <div class="nav-arrow right">&#62;</div>
    <!-- Página se renderiza aquí -->
  </div>
  <script>
    alert('¡Bienvenido a nuestro número de noviembre de Conecta! Haz click en la parte izquierda y derecha de cada página para navegar por la revista 😊');
    // Lista de imágenes de páginas (puedes cambiar las URLs por las de tus páginas)
    const pages = [
      '1.webp',
      '2.webp',
      '3.webp',
      '4.webp',
      '5.webp',
      '6.webp',
      '7.webp',
      '8.webp',
      '9.webp',
      '10.webp',
      '11.webp',
      '12.webp',
      '13.webp',
      '14.webp',
      '15.webp',
      '16.webp',
      '17.webp',
      '18.webp',
      '19.webp',
      '20.webp',
      '21.webp'    ];
    // Páginas con franja central y enlace
    const centralStripPages = {
      2: 'https://www.facebook.com/groups/clubcarrefourfamilia/posts/1227591265691990/',  // Página 3
      11: 'https://www.carrefour.es/clubcarrefour/clubs-deportivos/', // Página 12
      15: 'https://www.whatsapp.com/channel/0029Vasje9C17EmpFGiuhO0p', // Página 16
      18: 'https://www.carrefour.es/clubcarrefour/comunidades/', // Página 19
      19: 'https://www.carrefour.es/clubcarrefour/', // Página 20

    };
    let currentPage = 0;
    const flipbook = document.getElementById('flipbook');

    function renderPage() {
      flipbook.innerHTML = '';
      const pageDiv = document.createElement('div');
      pageDiv.className = 'flipbook-page';
      const img = document.createElement('img');
      img.className = 'page-img';
      img.src = pages[currentPage];
      img.alt = `Página ${currentPage+1}`;
      pageDiv.appendChild(img);
      // Franja central si corresponde
      if (centralStripPages[currentPage]) {
        const strip = document.createElement('div');
        strip.className = 'central-strip';
        const link = document.createElement('a');
        link.href = centralStripPages[currentPage];
        link.target = '_blank';
        link.textContent = '👆';
        strip.appendChild(link);
        pageDiv.appendChild(strip);
      }
      flipbook.appendChild(pageDiv);
    }

    function goLeft() {
      if (currentPage > 0) {
        currentPage--;
        renderPage();
      }
    }
    function goRight() {
      if (currentPage < pages.length - 1) {
        currentPage++;
        renderPage();
      }
    }
    // Click/tap: izquierda/derecha
    flipbook.addEventListener('click', function(e) {
      const rect = flipbook.getBoundingClientRect();
      const x = e.clientX - rect.left;
      if (x < rect.width / 2) {
        goLeft();
      } else {
        goRight();
      }
    });
    // Swipe para mobile
    let touchStartX = null;
    flipbook.addEventListener('touchstart', function(e) {
      if (e.touches.length === 1) {
        touchStartX = e.touches[0].clientX;
      }
    });
    flipbook.addEventListener('touchend', function(e) {
      if (touchStartX !== null && e.changedTouches.length === 1) {
        const dx = e.changedTouches[0].clientX - touchStartX;
        if (dx > 40) goLeft();
        else if (dx < -40) goRight();
        touchStartX = null;
      }
    });
    // Inicializar
    renderPage();
  </script>
</body>
</html>
