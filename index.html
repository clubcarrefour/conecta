<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flipbook sencillo</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #222;
      color: #fff;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    .flipbook-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      background: #ffffff;
      touch-action: manipulation;
    }
    .flipbook-page {
      width: 100vw;
      max-width: 600px;
      height: 80vh;
      max-height: 900px;
      background: #fff;
      box-shadow: 0 4px 24px rgba(0,0,0,0.3);
      border-radius: 8px;
      overflow: hidden;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: box-shadow 0.2s;
    }
    .central-strip {
      position: absolute;
      top: 80%;
      left: 0;
      width: 100%;
      height: 20%;
      background: rgba(0,0,0,0.0);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
    }
    .central-strip a {
      color: #fff;
      background: #0078d7;
      padding: 0.5em 1.2em;
      border-radius: 20px;
      text-decoration: none;
      font-weight: bold;
      font-size: 1.1em;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    img.page-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    @media (max-width: 600px) {
      .flipbook-page {
        max-width: 100vw;
        max-height: 80vh;
      }
    }
  </style>
</head>
<body>
  <div class="flipbook-container" id="flipbook">
    <!-- Página se renderiza aquí -->
  </div>
  <script>
    // Lista de imágenes de páginas (puedes cambiar las URLs por las de tus páginas)
    const pages = [
      '1.webp',
      '2.webp',
      '3.webp',
      '4.webp',
      '5.webp',
      '6.webp',
      '7.webp',
      '8.webp',
      '9.webp',
      '10.webp',
      '11.webp',
      '12.webp',
      '13.webp',
      '14.webp',
      '15.webp',
      '16.webp',
      '17.webp',
      '18.webp',
      '19.webp',
      '20.webp',
      '21.webp'    ];
    // Páginas con franja central y enlace
    const centralStripPages = {
      2: 'https://www.facebook.com/groups/clubcarrefourfamilia/posts/1227591265691990/',  // Página 3
      11: 'https://www.carrefour.es/clubcarrefour/clubs-deportivos/', // Página 12
      15: 'https://www.whatsapp.com/channel/0029Vasje9C17EmpFGiuhO0p', // Página 16
      18: 'https://www.carrefour.es/clubcarrefour/comunidades/', // Página 19
      19: 'https://www.carrefour.es/clubcarrefour/', // Página 20

    };
    let currentPage = 0;
    const flipbook = document.getElementById('flipbook');

    function renderPage() {
      flipbook.innerHTML = '';
      const pageDiv = document.createElement('div');
      pageDiv.className = 'flipbook-page';
      const img = document.createElement('img');
      img.className = 'page-img';
      img.src = pages[currentPage];
      img.alt = `Página ${currentPage+1}`;
      pageDiv.appendChild(img);
      // Franja central si corresponde
      if (centralStripPages[currentPage]) {
        const strip = document.createElement('div');
        strip.className = 'central-strip';
        const link = document.createElement('a');
        link.href = centralStripPages[currentPage];
        link.target = '_blank';
        link.textContent = '👆';
        strip.appendChild(link);
        pageDiv.appendChild(strip);
      }
      flipbook.appendChild(pageDiv);
    }

    function goLeft() {
      if (currentPage > 0) {
        currentPage--;
        renderPage();
      }
    }
    function goRight() {
      if (currentPage < pages.length - 1) {
        currentPage++;
        renderPage();
      }
    }
    // Click/tap: izquierda/derecha
    flipbook.addEventListener('click', function(e) {
      const rect = flipbook.getBoundingClientRect();
      const x = e.clientX - rect.left;
      if (x < rect.width / 2) {
        goLeft();
      } else {
        goRight();
      }
    });
    // Swipe para mobile
    let touchStartX = null;
    flipbook.addEventListener('touchstart', function(e) {
      if (e.touches.length === 1) {
        touchStartX = e.touches[0].clientX;
      }
    });
    flipbook.addEventListener('touchend', function(e) {
      if (touchStartX !== null && e.changedTouches.length === 1) {
        const dx = e.changedTouches[0].clientX - touchStartX;
        if (dx > 40) goLeft();
        else if (dx < -40) goRight();
        touchStartX = null;
      }
    });
    // Inicializar
    renderPage();
  </script>
</body>
</html>
